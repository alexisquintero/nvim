name: update-lazy-lock
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 19 * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: master

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Setup nvim config
        run: |
          mkdir -p ~/.config
          ln -s $GITHUB_WORKSPACE ~/.config/nvim

      - name: Update lazy lock file
        run: |
          nix shell nixpkgs#{neovim,gnumake,gcc,git} --command \
            nvim --headless "+Lazy! sync" "+qa"

      - name: Smoke test
        run: |
          output=$(nix shell nixpkgs#{neovim,gnumake,gcc,git} --command nvim --headless "+qa" 2>&1)
          if echo "$output" | grep -qE "Error detected|stack traceback"; then
            echo "Startup errors detected:"
            echo "$output"
            exit 1
          fi

      - name: Commit updated lock file
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v7.2.0
        with:
          commit_message: Update lazy lock file
          branch: update/lazy-lock
          create_branch: true

      - name: Create PR
        if: steps.commit.outputs.changes_detected == 'true'
        run: |
          gh pr create \
            --title "Update lazy lock file" \
            --body "Automated plugin update via \`Lazy sync\`" \
            --base master \
            --head update/lazy-lock \
          || gh pr view update/lazy-lock --json url -q .url
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
